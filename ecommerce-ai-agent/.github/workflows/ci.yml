name: AI Agent CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-cov httpx pytest-mock slowapi pyjwt ruff
        pip install -r requirements.txt || true

    - name: Run Ruff Lint Check
      run: |
        python -m ruff check .

    - name: Run Pytest Suite with Coverage
      env:
        JWT_SECRET: "ci-testing-secret-key-32-bytes-long-12345"
        ENVIRONMENT: "testing"
      run: |
        python -m pytest tests/ -v --cov=app --cov=main --cov-report=xml